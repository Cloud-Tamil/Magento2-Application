upstream fastcgi_backend {
    server php:9000;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/pub;
    index index.php index.html;

    charset UTF-8;

    client_max_body_size 64M;

    # ========================================================
    # SECURITY HEADERS
    # ========================================================

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ========================================================
    # HEALTH CHECK
    # IMPORTANT:
    # Do NOT check Magento "/" here.
    # This endpoint must only verify Nginx itself.
    # ========================================================

    location = /health-check {
        access_log off;

        default_type text/plain;

        add_header Cache-Control "no-store" always;

        return 200 "OK\n";
    }

    # ========================================================
    # BLOCK SENSITIVE FILES
    # ========================================================

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /(app|lib|var|generated|vendor|setup|update)/ {
        deny all;
    }

    # ========================================================
    # MAIN MAGENTO APPLICATION
    # ========================================================

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ========================================================
    # STATIC CONTENT
    # ========================================================

    location /static/ {

        # Remove Magento static version prefix.
        location ~ ^/static/version\d*/ {
            rewrite ^/static/(version\d*/)?(.*)$ /static/$2 last;
        }

        expires max;

        add_header Cache-Control "public, immutable";

        try_files $uri $uri/ /static.php?resource=$uri&$args;
    }

    # ========================================================
    # MEDIA
    # ========================================================

    location /media/ {

        expires max;

        add_header Cache-Control "public";

        try_files $uri $uri/ /get.php?$args;
    }

    # ========================================================
    # PHP
    # ========================================================

    location ~ \.php$ {

        # Only execute existing PHP files.
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass fastcgi_backend;

        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_param MAGE_RUN_CODE default;
        fastcgi_param MAGE_RUN_TYPE store;

        # ====================================================
        # FASTCGI BUFFER
        # Prevent:
        # "upstream sent too big header"
        # ====================================================

        fastcgi_buffer_size 128k;
        fastcgi_buffers 8 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # ====================================================
        # TIMEOUT
        # ====================================================

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 600s;
        fastcgi_read_timeout 600s;

        # ====================================================
        # DO NOT CACHE PHP
        # ====================================================

        add_header Cache-Control "no-store" always;
    }

    # ========================================================
    # BLOCK PHP FILES IN UPLOAD DIRECTORIES
    # ========================================================

    location ~* ^/(media|pub/media)/.*\.php$ {
        deny all;
    }

    # ========================================================
    # FAVICON
    # ========================================================

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # ========================================================
    # ROBOTS
    # ========================================================

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
