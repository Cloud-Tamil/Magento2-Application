upstream fastcgi_backend {
    server php:9000;
}


server {

    listen 80;
    server_name localhost;

    root /var/www/html/pub;

    index index.php;

    charset UTF-8;

    client_max_body_size 64M;


    # ======================================================
    # MAIN MAGENTO ROUTING
    # ======================================================

    location / {

        try_files $uri $uri/ /index.php?$args;

    }


    # ======================================================
    # PHP
    # ======================================================

    location ~ ^/(index|get|static|errors/report|errors/404|errors/503)\.php$ {

        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass fastcgi_backend;

        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_param MAGE_RUN_TYPE store;
        fastcgi_param MAGE_RUN_CODE default;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_read_timeout 600;

    }


    # ======================================================
    # STATIC
    # ======================================================

    location /static/ {

        location ~ ^/static/version\d*/ {

            rewrite ^/static/(version\d*/)?(.*)$ /static/$2 last;

        }

        try_files $uri $uri/ /static.php?resource=$uri&$args;

        expires max;

        add_header Cache-Control "public";

    }


    # ======================================================
    # MEDIA
    # ======================================================

    location /media/ {

        try_files $uri $uri/ /get.php?$args;

        expires max;

        add_header Cache-Control "public";

    }


    # ======================================================
    # FAVICON
    # ======================================================

    location = /favicon.ico {

        log_not_found off;
        access_log off;

    }


    # ======================================================
    # ROBOTS
    # ======================================================

    location = /robots.txt {

        try_files $uri /errors/404.php;

        log_not_found off;
        access_log off;

    }


    # ======================================================
    # BLOCK HIDDEN FILES
    # ======================================================

    location ~ /\. {

        deny all;

    }


    # ======================================================
    # BLOCK INTERNAL DIRECTORIES
    # ======================================================

    location ~* ^/(app|var|vendor|generated|lib|setup|update)/ {

        deny all;

    }


    # ======================================================
    # BLOCK CONFIGURATION FILES
    # ======================================================

    location ~* /(composer\.json|composer\.lock|auth\.json)$ {

        deny all;

    }


    # ======================================================
    # BLOCK SENSITIVE FILES
    # ======================================================

    location ~* \.(env|ini|log|sh|sql|bak|dist)$ {

        deny all;

    }

}
