services:

  # ==========================================================
  # DATABASE
  # ==========================================================

  db:
    image: mariadb:11.8
    container_name: magento-db
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

    command:
      - --max_allowed_packet=128M
      - --innodb_buffer_pool_size=512M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - magento


  # ==========================================================
  # VALKEY
  # ==========================================================

  valkey:
    image: valkey/valkey:8.1
    container_name: magento-valkey
    restart: unless-stopped

    command:
      - valkey-server
      - --appendonly
      - "yes"

    ports:
      - "${VALKEY_HOST_PORT:-6379}:6379"

    volumes:
      - valkey_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "valkey-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

    networks:
      - magento


  # ==========================================================
  # OPENSEARCH
  # ==========================================================

  opensearch:
    image: opensearchproject/opensearch:3.3.0
    container_name: magento-opensearch
    restart: unless-stopped

    environment:
      discovery.type: single-node

      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"

      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS}

      bootstrap.memory_lock: "true"

    ulimits:
      memlock:
        soft: -1
        hard: -1

    ports:
      - "${OPENSEARCH_HOST_PORT:-9200}:9200"

    volumes:
      - opensearch_data:/usr/share/opensearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

    networks:
      - magento


  # ==========================================================
  # PHP-FPM / MAGENTO
  # ==========================================================

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

      args:
        PHP_VERSION: "8.4"
        COMPOSER_VERSION: "2.10"
        MAGENTO_VERSION: "${MAGENTO_VERSION}"

    container_name: magento-php
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306

      VALKEY_HOST: valkey
      VALKEY_PORT: 6379

      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200

      MAGENTO_VERSION: ${MAGENTO_VERSION}
      MAGENTO_BASE_URL: ${MAGENTO_BASE_URL}

    volumes:
      # IMPORTANT:
      # Magento source lives on the host under ./src
      - ./src:/var/www/html

    depends_on:
      db:
        condition: service_healthy

      valkey:
        condition: service_healthy

      opensearch:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php-fpm -t >/dev/null 2>&1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - magento


  # ==========================================================
  # NGINX
  # ==========================================================

  nginx:
    image: nginx:1.30
    container_name: magento-nginx
    restart: unless-stopped

    depends_on:
      php:
        condition: service_healthy

    ports:
      - "${NGINX_PORT:-8080}:80"

    volumes:
      - ./src:/var/www/html:ro

      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost/ >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - magento


# ==========================================================
# NETWORK
# ==========================================================

networks:

  magento:
    name: magento-network
    driver: bridge


# ==========================================================
# PERSISTENT DATA
# ==========================================================

volumes:

  mariadb_data:
    name: magento-mariadb-data

  valkey_data:
    name: magento-valkey-data

  opensearch_data:
    name: magento-opensearch-data
